name: Atlas checks
on:
  push:
    branches: [main, feature/spot-pwa-foundation]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atlas-Trade/app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ATLAS_DISABLE_SCHEDULER=1 pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atlas-Trade/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
