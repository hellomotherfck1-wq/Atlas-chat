services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ATLAS_DB: /data/atlas.db
      ATLAS_FEE_RATE: "0.001"
      ATLAS_SLIPPAGE_RATE: "0.0005"
    volumes:
      - atlas-data:/data
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  atlas-data:
